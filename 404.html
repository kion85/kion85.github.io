<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | k85OS</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-2: #2563eb;
      --border: #1f2937;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }

    .error-container {
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      margin: 0;
      line-height: 1;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    .error-title {
      font-size: 1.5rem;
      margin: 10px 0;
      font-weight: 600;
    }

    .error-text {
      color: var(--muted);
      margin: 0 0 30px;
      font-size: 1rem;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      appearance: none; 
      border: none; 
      cursor: pointer;
      padding: 12px 24px; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 0.95rem;
      transition: .18s; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      text-decoration: none;
    }

    .btn:active { transform: translateY(1px); }
    
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-2); }
    
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--panel); }

    /* Изображение */
    .capybara-img {
      width: 100%;
      max-width: 351px; /* Ваш оригинальный размер */
      height: auto;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    /* Анимация легкого покачивания для капибары */
    .capybara-img:hover {
      transform: scale(1.02) rotate(1deg);
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Страница не найдена</h2>
    <p class="error-text">Похоже, вы забрели не туда. Такой страницы не существует или она была перемещена.</p>
    
    <div class="btn-group">
      <a href="https://kion85.github.io/" class="btn btn-primary">🏠 На главную</a>
      <a href="https://github.com/kion85/k85OS" target="_blank" class="btn btn-ghost">🐙 GitHub</a>
    </div>

    <!-- Ваша капибара -->
    <img src="logo3.jpg" alt="Капибара 404" class="capybara-img">
  </div>

</body>
</html>
