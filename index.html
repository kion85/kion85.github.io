<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>k85 UEFI — kion85</title>
<style>
:root{--bg:#0c0c10;--fg:#d8d8e0;--ac:#ff2d4a;--hl:#ff2d4a;--hf:#fff;--fs:15px;--ff:system-ui,'Segoe UI',Roboto,sans-serif;--r:6px;--po:.88;--dim:.35;
--ln:color-mix(in srgb,var(--bg) 70%,var(--fg));--p:color-mix(in srgb,color-mix(in srgb,var(--bg) 92%,var(--fg)) calc(var(--po)*100%),transparent);--mu:color-mix(in srgb,var(--fg) 60%,var(--bg))}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:var(--fs)/1.4 var(--ff);min-height:100vh}
#wall{position:fixed;inset:0;background:var(--bg) center/cover no-repeat}
#wall::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim)}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
body.scan #app::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);z-index:4}
body.glow{text-shadow:0 0 6px color-mix(in srgb,var(--ac) 60%,transparent)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--p);border-bottom:2px solid var(--ac);backdrop-filter:blur(8px)}
header b{letter-spacing:.05em}header .sp{flex:1}
.tg2{border:1px solid var(--ln);border-radius:var(--r);padding:1px 8px;color:var(--mu);font-size:.85em}
.wrap{flex:1;display:grid;grid-template-columns:170px 1fr 270px;gap:12px;padding:12px 16px;max-width:1400px;width:100%;margin:0 auto}
@media(max-width:940px){.wrap{grid-template-columns:1fr}}
nav{display:flex;flex-direction:column;gap:3px}
@media(max-width:940px){nav{flex-direction:row;flex-wrap:wrap}}
.nv{background:var(--p);border:1px solid var(--ln);color:var(--fg);text-align:left;padding:7px 10px;border-radius:var(--r);cursor:pointer;font:inherit}
.nv.on{background:var(--hl);color:var(--hf);border-color:var(--hl)}
#pane,#side>div{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:14px;min-width:0;backdrop-filter:blur(8px)}
#side{display:flex;flex-direction:column;gap:12px}
#help{color:var(--ac);font-size:.9em;min-height:70px}
h3{margin:14px 0 6px;color:var(--ac);font-size:.8em;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--ln);padding-bottom:3px}h3:first-child{margin-top:0}
h4{font-size:.75em;letter-spacing:.1em;color:var(--ac);margin-bottom:6px}
.r{display:flex;justify-content:space-between;gap:10px;padding:4px 6px;flex-wrap:wrap;align-items:center;border-radius:4px}
.r:hover{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.r>span:first-child{color:var(--mu)}.r>span:last-child{text-align:right;overflow-wrap:anywhere}
button,input,select{font:inherit;color:var(--fg);background:color-mix(in srgb,var(--bg) 80%,var(--fg));border:1px solid var(--ln);border-radius:var(--r);padding:2px 9px;max-width:100%}
button{cursor:pointer}button.on{border-color:var(--ac);color:var(--ac)}
input[type=color]{padding:0;height:26px;width:46px}input[type=range]{padding:0;accent-color:var(--ac)}
button:focus,input:focus,select:focus,a:focus,.nv:focus{outline:2px solid var(--ac);outline-offset:1px}
select option{background:#111;color:#eee}a{color:var(--ac)}
.li{display:flex;gap:8px;padding:4px 6px;align-items:center;border-radius:4px}.li:hover{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.li.on{background:var(--hl);color:var(--hf)}.li.on button{color:var(--hf)}
.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:var(--mu)}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.wg div{border:1px solid var(--ln);border-radius:var(--r);padding:3px;text-align:center;font-size:.8em}.wg div.on{outline:2px solid var(--ac)}
.wg img{width:100%;height:70px;object-fit:cover;display:block;cursor:pointer;border-radius:4px}
.fl{display:flex;flex-wrap:wrap;gap:6px 8px}.fl a{display:flex;align-items:center;gap:5px;border:1px solid var(--ln);border-radius:var(--r);padding:2px 8px;text-decoration:none}.fl img{width:20px;height:20px;border-radius:50%}
.lb,.mb{display:grid;grid-template-columns:90px 1fr 56px;gap:8px;align-items:center;font-size:.85em;margin:3px 0}
.lb i,.mb i{height:8px;background:color-mix(in srgb,var(--bg) 70%,var(--fg));border-radius:4px;overflow:hidden}.lb b,.mb b{display:block;height:100%;background:var(--ac)}.lb em,.mb em{font-style:normal;text-align:right;color:var(--mu)}
canvas{border:1px solid var(--ln);border-radius:var(--r);max-width:100%;background:color-mix(in srgb,var(--bg) 90%,#000);display:block;margin:6px 0}
footer{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 16px;background:var(--p);border-top:1px solid var(--ln);font-size:.82em;backdrop-filter:blur(8px)}
footer .k{flex:1;min-width:220px;color:var(--mu)}#nt{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ac)}
#post{position:fixed;inset:0;z-index:60;background:#000;color:#ddd;display:grid;place-items:center;text-align:center;font:16px system-ui,sans-serif}
#post b{font-size:2em;letter-spacing:.15em;color:#fff}.pb{width:260px;height:6px;background:#222;margin:18px auto 14px;border-radius:3px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:#e33;transition:width 1.6s ease-out}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--hl);color:var(--hf);padding:5px 16px;border-radius:var(--r);display:none;z-index:70;font-weight:600}
#bri,#night{position:fixed;inset:0;pointer-events:none;z-index:80}#bri{background:#000}#night{background:#ff8a1e;mix-blend-mode:multiply}
</style></head><body>
<div id="wall"></div><div id="post"></div>
<div id="app">
<header><b id="logo">k85 UEFI</b><span class="tg2" id="ttl"></span><span class="sp"></span>
<button id="hv0" title="Volume −">VOL −</button><button id="hv1" title="Volume +">VOL +</button><button id="hm" title="Mute (M)">MUTE</button>
<button id="hb0" title="Dim ([)">BRT −</button><button id="hb1" title="Brighten (])">BRT +</button><span class="tg2" id="clk"></span></header>
<div class="wrap"><nav id="nav"></nav><section id="pane"></section>
<aside id="side"><div id="help"></div><div><h4>HARDWARE MONITOR</h4>
<div class="mb"><span>Volume</span><i><b id="mv"></b></i><em id="mvt"></em></div>
<div class="mb"><span>Brightness</span><i><b id="mb"></b></i><em id="mbt"></em></div>
<div class="mb"><span>Night light</span><i><b id="mn"></b></i><em id="mnt"></em></div>
<div class="mb"><span>Wall dim</span><i><b id="md"></b></i><em id="mdt"></em></div></div></aside></div>
<footer><span class="k">←→ разделы · ↑↓ пункты · +/− громкость · [ ] яркость · M mute · F10 сохранить · Esc выход</span>
<button id="p0">⏮</button><button id="p1">▶</button><button id="p2">⏭</button><span id="nt">— нет трека —</span><input type="range" id="sk" min="0" max="1000" value="0" style="width:110px"></footer></div>
<div id="toast"></div><div id="bri"></div><div id="night"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH={'ROG Red':['#0c0c10','#d8d8e0','#ff2d4a','#ff2d4a','#ffffff'],'MSI Blue':['#0a1020','#d6e0f5','#2f9bff','#2f9bff','#ffffff'],'Gigabyte Orange':['#101010','#e6e6e6','#ff8a00','#ff8a00','#000000'],'AMI Classic':['#0000a8','#c0c0c0','#ffff55','#00a8a8','#000000'],'Matrix':['#000a00','#00cc33','#aaffaa','#00cc33','#000000'],'GitHub Dark':['#0d1117','#c9d1d9','#58a6ff','#1f6feb','#ffffff'],'GitHub Light':['#ffffff','#24292f','#0969da','#0969da','#ffffff'],'Dracula':['#282a36','#f8f8f2','#bd93f9','#bd93f9','#282a36']};
const FF={'System UI':"system-ui,'Segoe UI',Roboto,sans-serif",'Mono':"ui-monospace,Consolas,'DejaVu Sans Mono',monospace",'Courier':"'Courier New',monospace",'Serif':"Georgia,serif"};
const DEF={theme:'ROG Red',c:[...TH['ROG Red']],fs:15,ff:FF['System UI'],scan:0,glow:0,boot:1,pbeep:1,dim:.35,po:.88,rad:6,slide:0,wall:null,fit:'cover',title:'k85 UEFI BIOS Utility',btxt:'k85 UEFI',user:'kion85',vol:.7,mute:0,fade:1,bass:0,treb:0,shuf:0,rep:1,ui:1,uv:.6,br:1,nl:0};
let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.k85||'{}')}}catch{}
const S0=JSON.stringify(S),save=()=>localStorage.k85=JSON.stringify(S),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1600)}
/* UI sound (WebAudio) */
let AC;const ctx=()=>AC||(AC=new(window.AudioContext||webkitAudioContext)());
function beep(f=800,d=.05,ty='square'){if(!S.ui||S.mute)return;try{const c=ctx();c.resume();const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.07*S.uv*Math.max(S.vol,.15),c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}
const chord=()=>[660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.09,'triangle'),i*90));
/* theme */
const FM={vol:v=>Math.round(v*100)+'%',br:v=>Math.round(v*100)+'%',nl:v=>Math.round(v*100)+'%',dim:v=>Math.round(v*100)+'%',po:v=>Math.round(v*100)+'%',uv:v=>Math.round(v*100)+'%',fade:v=>v+'s',bass:v=>v+' dB',treb:v=>v+' dB',fs:v=>v+'px',rad:v=>v+'px',slide:v=>v?v+'s':'off'};
function theme(){const c=S.theme==='Custom'?S.c:TH[S.theme]||S.c,r=document.documentElement.style;['--bg','--fg','--ac','--hl','--hf'].forEach((k,i)=>r.setProperty(k,c[i]));
r.setProperty('--fs',S.fs+'px');r.setProperty('--ff',S.ff);r.setProperty('--dim',S.dim);r.setProperty('--po',S.po);r.setProperty('--r',S.rad+'px');
document.body.classList.toggle('scan',!!S.scan);document.body.classList.toggle('glow',!!S.glow);$('#ttl').textContent=S.title;$('#logo').textContent=S.btxt;
$('#bri').style.opacity=1-S.br;$('#night').style.opacity=S.nl*.6;$('#wall').style.backgroundSize=S.fit;$('#hm').classList.toggle('on',!!S.mute);mon()}
function mon(){const b=(i,v,t)=>{$('#'+i).style.width=v*100+'%';$('#'+i+'t').textContent=t};b('mv',S.mute?0:S.vol,S.mute?'MUTE':FM.vol(S.vol));b('mb',S.br,FM.br(S.br));b('mn',S.nl,FM.nl(S.nl));b('md',S.dim,FM.dim(S.dim))}
/* db */
const idb=new Promise((r,j)=>{const q=indexedDB.open('k85bios',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=async(m,f)=>{const d=await idb;return new Promise((r,j)=>{const t=d.transaction('f',m),q=f(t.objectStore('f'));t.oncomplete=()=>r(q.result);t.onerror=j})};
const dbAll=()=>tx('readonly',s=>s.getAll()),dbAdd=o=>tx('readwrite',s=>s.add(o)),dbDel=i=>tx('readwrite',s=>s.delete(i)),dbClr=()=>tx('readwrite',s=>s.clear());
let pl=[],wl=[];const refresh=async()=>{const a=await dbAll();pl=a.filter(x=>x.t==='s');wl=a.filter(x=>x.t==='w')};
let wu,wt;function wall(){if(wu)URL.revokeObjectURL(wu);const f=wl.find(x=>x.id==S.wall);wu=f?URL.createObjectURL(f.blob):null;$('#wall').style.backgroundImage=wu?`url(${wu})`:'none';
clearInterval(wt);if(S.slide>0&&wl.length>1)wt=setInterval(()=>{const i=wl.findIndex(x=>x.id==S.wall);S.wall=wl[(i+1)%wl.length].id;wall()},S.slide*1000)}
/* volume / brightness */
const syncR=k=>{const e=$(`#pane [data-k=${k}]`);if(e){e.value=S[k];e.closest('.r').firstChild.textContent=e.dataset.l+' '+(FM[k]?FM[k](S[k]):S[k])}};
function setVol(v){S.vol=Math.round(cl(v,0,1)*20)/20;if(v>0)S.mute=0;A.muted=!!S.mute;clearInterval(ft);A.volume=S.vol;save();theme();syncR('vol');toast('Volume '+FM.vol(S.vol));beep(500+S.vol*900,.05)}
function setBr(v){S.br=Math.round(cl(v,.2,1)*20)/20;save();theme();syncR('br');toast('Brightness '+FM.br(S.br));beep(400+S.br*600,.05)}
function setMute(){S.mute=+!S.mute;A.muted=!!S.mute;save();theme();toast(S.mute?'Muted':'Unmuted');if(!S.mute)beep(900,.05)}
/* player */
const A=new Audio();let cur=-1,au,ft,G;
function graph(){if(G)return;const c=ctx(),s=c.createMediaElementSource(A),b=c.createBiquadFilter(),t=c.createBiquadFilter(),an=c.createAnalyser();b.type='lowshelf';b.frequency.value=200;t.type='highshelf';t.frequency.value=3000;an.fftSize=64;s.connect(b);b.connect(t);t.connect(an);an.connect(c.destination);G={b,t,an};eq()}
const eq=()=>{if(G){G.b.gain.value=S.bass;G.t.gain.value=S.treb}};
function fade(to,sec,done){clearInterval(ft);if(!sec){A.volume=to;done&&done();return}const f=A.volume,t0=performance.now();ft=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/(sec*1000));A.volume=f+(to-f)*k;if(k>=1){clearInterval(ft);done&&done()}},40)}
async function play(i){if(!pl.length)return;cur=(i+pl.length)%pl.length;if(au)URL.revokeObjectURL(au);au=URL.createObjectURL(pl[cur].blob);A.src=au;try{graph();await ctx().resume()}catch{}A.muted=!!S.mute;A.volume=S.fade?0:S.vol;try{await A.play()}catch{}fade(S.vol,S.fade);now()}
function pp(){if(cur<0)return play(0);if(A.paused){A.play();fade(S.vol,S.fade)}else fade(0,S.fade,()=>{A.pause();A.volume=S.vol})}
function now(){$('#nt').textContent=cur>=0&&pl[cur]?pl[cur].name:'— нет трека —';$('#p1').textContent=A.paused?'▶':'⏸';if(tab==='Audio')list()}
A.onended=()=>{if(S.rep==2)play(cur);else if(S.shuf)play(Math.random()*pl.length|0);else if(cur<pl.length-1||S.rep==1)play(cur+1);else now()};
A.onpause=A.onplay=now;A.ontimeupdate=()=>{if(A.duration)$('#sk').value=A.currentTime/A.duration*1000};
$('#sk').oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration};
$('#p0').onclick=()=>play(cur-1);$('#p2').onclick=()=>S.shuf?play(Math.random()*pl.length|0):play(cur+1);$('#p1').onclick=pp;
$('#hv0').onclick=()=>setVol(S.vol-.05);$('#hv1').onclick=()=>setVol(S.vol+.05);$('#hm').onclick=setMute;$('#hb0').onclick=()=>setBr(S.br-.05);$('#hb1').onclick=()=>setBr(S.br+.05);
/* GitHub data */
let GH;
function ghLoad(force){if(GH&&GH.u===S.user&&!force)return Promise.resolve(GH);
if(!force)try{const c=JSON.parse(localStorage.k85gh);if(c.u===S.user&&Date.now()-c.t<6e5)return Promise.resolve(GH=c)}catch{}
const u=S.user,g=p=>fetch('https://api.github.com/'+p).then(r=>r.ok?r.json():null).catch(()=>null);
return Promise.all([g('users/'+u),g(`users/${u}/repos?per_page=100&sort=updated`),g(`users/${u}/events/public?per_page=30`),g(`users/${u}/starred?per_page=30`),g(`users/${u}/orgs`),g(`users/${u}/gists?per_page=20`),g(`users/${u}/followers?per_page=40`),g(`users/${u}/following?per_page=40`),g('rate_limit')]).then(([p,r,e,st,o,gi,fo,fg,rl])=>{GH={u,t:Date.now(),p,r,e,st,o,gi,fo,fg,rl};if(p)try{localStorage.k85gh=JSON.stringify(GH)}catch{}return GH})}
const dt=s=>s?new Date(s).toLocaleDateString('ru-RU'):'—',ok=(d,id)=>$('#'+id)&&d;
const row=(l,c,h='')=>`<div class="r" data-h="${esc(h)}"><span>${l}</span><span>${c}</span></div>`;
const opt=(o,v)=>o.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
const rg=(l,k,a,b,s,h)=>row(l+' '+(FM[k]?FM[k](S[k]):S[k]),`<input type=range data-k=${k} data-l="${l}" min=${a} max=${b} step=${s} value=${S[k]}>`,h);
const cb=(l,k,h)=>row(l,`<button data-k=${k} data-b class="${S[k]?'on':''}">${S[k]?'Enabled':'Disabled'}</button>`,h);
const sel=(l,k,o,h)=>row(l,`<select data-k=${k}>${o.map(x=>Array.isArray(x)?`<option value="${esc(x[0])}" ${x[0]==S[k]?'selected':''}>${x[1]}</option>`:`<option ${x==S[k]?'selected':''}>${esc(x)}</option>`).join('')}</select>`,h);
const lnk=u=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u.replace('https://',''))}</a>`;
const NAV=[['Main','⌂'],['GitHub','◉'],['Repos','▤'],['Activity','⚡'],['Starred','★'],['Social','☍'],['Games','▶'],['Customize','⚙'],['Wallpaper','▣'],['Audio','♫'],['Monitor','◈'],['Boot','↻'],['Exit','⏻']];
let tab='Main',vr,gk,gi,graf,snd;
const V={
Main:()=>`<h3>System</h3>${row('Firmware','k85 UEFI v2.0')}${row('User',esc(S.user),'Ник на GitHub/GitLab (меняется в Customize).')}${row('Local time','<b id=ck2></b>')}${row('OS','Linux')}${row('Browser','Firefox')}
<h3>Network</h3>${row('Primary router','RV669')}${row('Secondary router','Rostelecom RT FL 1 | S1010')}${row('Backup','ZTE 4G LTE')}
<h3>GitHub snapshot</h3><div id=ms>Loading…</div>
<h3>Links</h3>${row('GitHub',lnk('https://github.com/'+S.user))}${row('GitLab',lnk('https://gitlab.com/'+S.user))}
<h3>Storage</h3>${row('Songs',pl.length)}${row('Wallpapers',wl.length)}`,
GitHub:()=>`<h3>Profile</h3><div id=g1>Loading…</div><h3>Totals</h3><div id=g2></div><h3>Languages</h3><div id=g3></div><h3>API</h3><div id=g4></div>`,
Repos:()=>`<h3>Repositories</h3>${row('Search','<input id=rq placeholder="name…">')}${row('Sort',`<select id=rs>${opt(['updated','stars','forks','name','size'],'updated')}</select>`)}${row('Language','<select id=rl><option>All</option></select>')}${row('Hide forks','<button id=rf>Disabled</button>')}<div id=rl2 style="margin-top:8px">Loading…</div>`,
Activity:()=>`<h3>Recent public activity</h3><div id=ac>Loading…</div>`,
Starred:()=>`<h3>Starred repositories</h3><div id=st>Loading…</div>`,
Social:()=>`<h3>Followers</h3><div id=so1 class=fl>Loading…</div><h3>Following</h3><div id=so2 class=fl></div><h3>Organizations</h3><div id=so3 class=fl></div><h3>Gists</h3><div id=so4></div>`,
Games:()=>`<h3>Flappy Bird <button id=fr>Reset</button> Score <b id=fs>0</b></h3><canvas id=fc width=320 height=240></canvas>
<h3>Snake <button id=sr>Reset</button> Score <b id=ss>0</b></h3><canvas id=sn width=224 height=224 tabindex=0></canvas><div><button data-d="0,-1">▲</button><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div>
<h3>Reaction Test</h3><button id=rb style="width:100%;height:64px">Press to start</button>${row('Last <b id=rl3>—</b> ms','Best <b id=rbs>—</b> ms')}
<h3>Quick Math <button id=mr>Restart</button></h3><div style="font-size:1.4em" id=mq></div><input id=mi type=number placeholder=answer> Score <b id=ms2>0</b> · Time <b id=mt>30</b>`,
