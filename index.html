<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>k85 BIOS Setup — kion85</title>
<style>
:root{--bg:#0000a8;--fg:#c0c0c0;--ac:#ffff55;--hl:#00a8a8;--hf:#000;--fs:16px;--ff:'Courier New',monospace}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--fg);font:var(--fs)/1.4 var(--ff);min-height:100vh}
#wall{position:fixed;inset:0;background:var(--bg) center/cover no-repeat}
#wall::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim,.35)}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;border-left:2px solid var(--fg);border-right:2px solid var(--fg);background:color-mix(in srgb,var(--bg) 82%,transparent)}
body.scan #app::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
body.glow{text-shadow:0 0 6px currentColor}
#ttl{text-align:center;padding:6px;border-bottom:2px solid var(--fg);color:var(--ac);font-weight:bold}
#tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--fg)}
#tabs button{border:0;background:none;color:var(--fg);font:inherit;padding:6px 14px;cursor:pointer}
#tabs button.on{background:var(--hl);color:var(--hf)}
main{flex:1;display:grid;grid-template-columns:1fr 250px}
#pane{padding:12px 16px;border-right:2px solid var(--fg);min-width:0}
#help{padding:12px;color:var(--ac);font-size:.9em}
@media(max-width:760px){main{grid-template-columns:1fr}#pane{border-right:0}#help{border-top:2px solid var(--fg)}}
h3{margin:14px 0 6px;color:var(--ac);font-size:1em;border-bottom:1px dashed var(--fg)}
h3:first-child{margin-top:0}
.r{display:flex;justify-content:space-between;gap:10px;padding:2px 4px;flex-wrap:wrap;align-items:center}
.r:hover{background:color-mix(in srgb,var(--hl) 40%,transparent)}
.r>span:last-child{color:var(--ac);text-align:right}
button,input,select{font:inherit;color:var(--ac);background:transparent;border:1px solid var(--fg);padding:1px 6px;max-width:100%}
input[type=color]{padding:0;height:24px;width:44px}
input[type=range]{padding:0;accent-color:var(--ac)}
button{cursor:pointer}
button:focus,input:focus,select:focus,a:focus{outline:0;background:var(--hl);color:var(--hf)}
select option{background:#000;color:#fff}
a{color:var(--ac)}
.li{display:flex;gap:8px;padding:2px 4px;align-items:center}
.li.on{background:var(--hl);color:var(--hf)}.li.on button{color:var(--hf)}
.li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.wg div{border:1px solid var(--fg);padding:3px;text-align:center;font-size:.8em}
.wg div.on{border-color:var(--ac);outline:2px solid var(--ac)}
.wg img{width:100%;height:70px;object-fit:cover;display:block;cursor:pointer}
canvas{border:1px solid var(--fg);max-width:100%;background:var(--bg);display:block;margin:6px 0}
footer{border-top:2px solid var(--fg);padding:6px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.85em}
footer .k{flex:1;min-width:200px}
#nt{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ac)}
#post{position:fixed;inset:0;z-index:9;background:#000;color:#ccc;padding:20px;white-space:pre-wrap;font:16px/1.4 'Courier New',monospace}
#toast{position:fixed;right:14px;bottom:60px;z-index:8;background:var(--hl);color:var(--hf);padding:4px 12px;display:none}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div id="wall"></div><div id="post"></div>
<div id="app"><div id="ttl"></div><nav id="tabs"></nav>
<main><section id="pane"></section><aside id="help"></aside></main>
<footer><span class="k">←→ вкладки · ↑↓ пункты · Enter выбрать · F10 сохранить · Esc выход</span>
<button id="p0" title="prev">⏮</button><button id="p1" title="play">▶</button><button id="p2" title="next">⏭</button>
<span id="nt">— нет трека —</span><input type="range" id="sk" min="0" max="1000" value="0" style="width:110px"></footer></div>
<div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH={'AMI Classic':['#0000a8','#c0c0c0','#ffff55','#00a8a8','#000000'],'Award Amber':['#000000','#ffb000','#ffffff','#ffb000','#000000'],'Phoenix Slate':['#1c2b3a','#d0d8e0','#7fdbff','#7fdbff','#001018'],'Matrix':['#000a00','#00cc33','#aaffaa','#00cc33','#000000'],'GitHub Dark':['#0d1117','#c9d1d9','#58a6ff','#1f6feb','#ffffff'],'GitHub Light':['#ffffff','#24292f','#0969da','#0969da','#ffffff'],'Dracula':['#282a36','#f8f8f2','#bd93f9','#bd93f9','#282a36']};
const FF={'Courier New':"'Courier New',monospace",'Consolas / Menlo':"Consolas,Menlo,'DejaVu Sans Mono',monospace",'Ubuntu Mono':"'Ubuntu Mono','Liberation Mono',monospace",'Sans-serif':"system-ui,sans-serif",'Serif':"Georgia,serif"};
const DEF={theme:'AMI Classic',c:[...TH['AMI Classic']],fs:16,ff:FF['Courier New'],scan:1,glow:0,boot:1,dim:.35,slide:0,wall:null,title:'k85 BIOS Setup Utility',user:'kion85',vol:.7,shuf:0,rep:1};
let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.k85||'{}')}}catch{}
const save=()=>localStorage.k85=JSON.stringify(S);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function theme(){const c=S.theme==='Custom'?S.c:TH[S.theme]||S.c,r=document.documentElement.style;
['--bg','--fg','--ac','--hl','--hf'].forEach((k,i)=>r.setProperty(k,c[i]));r.setProperty('--fs',S.fs+'px');r.setProperty('--ff',S.ff);r.setProperty('--dim',S.dim);
document.body.classList.toggle('scan',!!S.scan);document.body.classList.toggle('glow',!!S.glow);$('#ttl').textContent=S.title}
/* storage: songs and wallpapers in IndexedDB */
const idb=new Promise((r,j)=>{const q=indexedDB.open('k85bios',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=async(m,f)=>{const d=await idb;return new Promise((r,j)=>{const t=d.transaction('f',m),q=f(t.objectStore('f'));t.oncomplete=()=>r(q.result);t.onerror=j})};
const dbAll=()=>tx('readonly',s=>s.getAll()),dbAdd=o=>tx('readwrite',s=>s.add(o)),dbDel=i=>tx('readwrite',s=>s.delete(i)),dbClr=()=>tx('readwrite',s=>s.clear());
let pl=[],wl=[];
async function refresh(){const a=await dbAll();pl=a.filter(x=>x.t==='s');wl=a.filter(x=>x.t==='w')}
/* wallpaper */
let wu,wt;
function wall(){if(wu)URL.revokeObjectURL(wu);const f=wl.find(x=>x.id==S.wall);wu=f?URL.createObjectURL(f.blob):null;$('#wall').style.backgroundImage=wu?`url(${wu})`:'none';
clearInterval(wt);if(S.slide>0&&wl.length>1)wt=setInterval(()=>{const i=wl.findIndex(x=>x.id==S.wall);S.wall=wl[(i+1)%wl.length].id;wall()},S.slide*1000)}
/* player */
const A=new Audio();let cur=-1,au;
async function play(i){if(!pl.length)return;cur=(i+pl.length)%pl.length;if(au)URL.revokeObjectURL(au);au=URL.createObjectURL(pl[cur].blob);A.src=au;A.volume=S.vol;try{await A.play()}catch{}now()}
function now(){$('#nt').textContent=cur>=0&&pl[cur]?pl[cur].name:'— нет трека —';$('#p1').textContent=A.paused?'▶':'⏸';if(tab==='Music')list()}
A.onended=()=>{if(S.rep==2)play(cur);else if(S.shuf)play(Math.random()*pl.length|0);else if(cur<pl.length-1||S.rep==1)play(cur+1);else now()};
A.onpause=A.onplay=now;A.ontimeupdate=()=>{if(A.duration)$('#sk').value=A.currentTime/A.duration*1000};
$('#sk').oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration};
$('#p0').onclick=()=>play(cur-1);$('#p2').onclick=()=>S.shuf?play(Math.random()*pl.length|0):play(cur+1);
$('#p1').onclick=()=>{if(cur<0)play(0);else A.paused?A.play():A.pause()};
/* tabs */
const TABS=['Main','GitHub','Games','Customize','Wallpaper','Music','Exit'];let tab='Main',GH=null;
function tabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join('')}
function go(t){stopG();tab=t;tabs();$('#pane').innerHTML=V[t]();B[t]&&B[t]();$('#help').textContent='Наведи или выбери пункт — здесь появится подсказка.'}
$('#tabs').onclick=e=>{const t=e.target.dataset.t;t&&go(t)};
const row=(l,c,h='')=>`<div class="r" data-h="${esc(h)}"><span>${l}</span><span>${c}</span></div>`;
const opt=(o,v)=>o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const V={
Main:()=>`<h3>System Information</h3>${row('BIOS','k85 Setup v1.0','BIOS-страница для твоего GitHub.')}${row('User',esc(S.user),'Ник на GitHub/GitLab.')}${row('System Time','<b id=clk></b>','Текущее время.')}${row('OS','Linux','Основная система.')}${row('Browser','Firefox','Браузер по умолчанию.')}
<h3>Network</h3>${row('Primary router','RV669')}${row('Secondary router','Rostelecom RT FL 1 | S1010')}${row('Backup','ZTE 4G LTE')}
<h3>Links</h3>${row('GitHub',`<a href="https://github.com/${esc(S.user)}" target="_blank" rel="noreferrer">github.com/${esc(S.user)}</a>`)}${row('GitLab',`<a href="https://gitlab.com/${esc(S.user)}" target="_blank" rel="noreferrer">gitlab.com/${esc(S.user)}</a>`)}
<h3>Storage</h3>${row('Songs',pl.length,'Загружено треков.')}${row('Wallpapers',wl.length,'Загружено обоев.')}`,
GitHub:()=>`<h3>GitHub Profile</h3><div id=ghp>Loading...</div><h3>Repositories</h3><div id=ghr></div><h3>Recent Activity</h3><div id=gha></div>`,
Games:()=>`<h3>Flappy Bird <button id=fr>Reset</button> Score: <b id=fs>0</b></h3><canvas id=fc width=320 height=240></canvas>
<h3>Reaction Test</h3><button id=rb style="width:100%;height:70px">Press to start</button><div class=r><span>Last: <b id=rl>—</b> ms</span><span>Best: <b id=rbst>—</b> ms</span></div>
<h3>Quick Math <button id=mr>Restart</button></h3><div style="font-size:1.4em" id=mq></div><input id=mi type=number placeholder="answer"> Score <b id=ms>0</b> · Time <b id=mt>30</b>`,
Customize:()=>{const cn=['Background','Text','Accent','Highlight','Highlight text'],c=S.theme==='Custom'?S.c:TH[S.theme]||S.c;return`<h3>Theme</h3>${row('Preset',`<select data-k=theme>${opt([...Object.keys(TH),'Custom'],S.theme)}</select>`,'Готовые темы. Любое изменение цвета переключает на Custom.')}
${cn.map((n,i)=>row(n,`<input type=color data-c=${i} value="${c[i]}">`,'Свой цвет.')).join('')}
<h3>Text</h3>${row('Font',`<select data-k=ff>${Object.entries(FF).map(([n,v])=>`<option value="${esc(v)}" ${v===S.ff?'selected':''}>${n}</option>`).join('')}</select>`)}${row('Font size '+S.fs,`<input type=range data-k=fs min=11 max=26 value=${S.fs}>`)}${row('Title',`<input data-k=title value="${esc(S.title)}">`,'Заголовок вверху.')}${row('GitHub user',`<input data-k=user value="${esc(S.user)}">`,'Ник, для которого грузятся репозитории.')}
<h3>Effects</h3>${row('CRT scanlines',`<input type=checkbox data-k=scan ${S.scan?'checked':''}>`)}${row('Text glow',`<input type=checkbox data-k=glow ${S.glow?'checked':''}>`)}${row('POST boot screen',`<input type=checkbox data-k=boot ${S.boot?'checked':''}>`,'Экран загрузки при открытии.')}${row('Wallpaper dim '+S.dim,`<input type=range data-k=dim min=0 max=.9 step=.05 value=${S.dim}>`,'Затемнение обоев.')}
<h3>Profile file</h3>${row('Settings',`<button id=ex>Export</button> <label><button onclick="this.nextElementSibling.click()">Import</button><input type=file id=im accept=.json hidden></label>`,'Сохранить настройки в файл или загрузить обратно.')}`},
Wallpaper:()=>`<h3>Wallpapers</h3>${row('Add images',`<button onclick="$('#wf').click()">Add...</button><input type=file id=wf accept="image/*" multiple hidden>`,'PNG, JPG, GIF, WebP. Хранятся в браузере.')}${row('Slideshow '+(S.slide?S.slide+'s':'off'),`<input type=range data-k=slide min=0 max=120 step=5 value=${S.slide}>`,'0 — без смены. Иначе меняет обои по таймеру.')}${row('Default',`<button id=w0>No wallpaper</button>`)}<div class=wg id=wg></div>`,
Music:()=>`<h3>Playlist</h3>${row('Add songs',`<button onclick="$('#sf').click()">Add...</button><input type=file id=sf accept="audio/*" multiple hidden>`,'MP3, OGG, WAV, FLAC и др. Хранятся в браузере.')}${row('Volume',`<input type=range data-k=vol min=0 max=1 step=.05 value=${S.vol}>`)}${row('Shuffle',`<input type=checkbox data-k=shuf ${S.shuf?'checked':''}>`)}${row('Repeat',`<select data-k=rep>${['Off','All','One'].map((o,i)=>`<option value=${i} ${i==S.rep?'selected':''}>${o}</option>`).join('')}</select>`)}<div id=pl></div>`,
Exit:()=>`<h3>Exit</h3>${row('Save Changes',`<button id=xs>Save</button>`,'Настройки сохраняются автоматически, F10 — подтверждение.')}${row('Load Setup Defaults',`<button id=xd>Defaults</button>`,'Сброс настроек (песни и обои остаются).')}${row('Erase songs & wallpapers',`<button id=xe>Erase</button>`,'Удалить все загруженные файлы.')}${row('Reboot',`<button id=xr>Reboot</button>`,'Перезагрузить страницу.')}`};
/* bindings */
function list(){const e=$('#pl');if(!e)return;e.innerHTML=pl.length?pl.map((s,i)=>`<div class="li ${i===cur?'on':''}"><button data-p=${i}>${i===cur&&!A.paused?'⏸':'▶'}</button><span class=n>${i+1}. ${esc(s.name)}</span><span>${(s.blob.size/1048576).toFixed(1)}MB</span><button data-d=${s.id}>✕</button></div>`).join(''):'<div class=r>Playlist is empty — add songs.</div>'}
function wgrid(){const g=$('#wg');if(!g)return;g.innerHTML=wl.map(w=>`<div class="${w.id==S.wall?'on':''}"><img data-w=${w.id} src="${w.u||(w.u=URL.createObjectURL(w.blob))}" alt=""><span class=n>${esc(w.name)}</span><br><button data-x=${w.id}>✕</button></div>`).join('')||'<div class=r>No wallpapers yet.</div>'}
const B={
Main(){const c=()=>{const e=$('#clk');if(e)e.textContent=new Date().toLocaleString('ru-RU')};c();clearInterval(B.t);B.t=setInterval(c,1000)},
GitHub(){if(GH&&GH.u===S.user)return gh(GH);const u=S.user,g=x=>fetch('https://api.github.com/'+x).then(r=>{if(!r.ok)throw 0;return r.json()});
Promise.all([g('users/'+u),g(`users/${u}/repos?per_page=30&sort=updated`),g(`users/${u}/events/public?per_page=10`)]).then(([p,r,e])=>{GH={u,p,r,e};if(tab==='GitHub')gh(GH)}).catch(()=>{$('#ghp').textContent='GitHub API error: нет сети, лимит запросов или неверный ник.';$('#ghr').textContent=$('#gha').textContent=''})},
Games(){gameInit()},
Customize(){$$('#pane [data-c]').forEach(i=>i.oninput=()=>{if(S.theme!=='Custom'){S.c=[...TH[S.theme]];S.theme='Custom';$('[data-k=theme]').value='Custom'}S.c[+i.dataset.c]=i.value;theme();save()});
$$('#pane [data-k]').forEach(i=>i.onchange=i.oninput=()=>{const k=i.dataset.k;let v=i.type==='checkbox'?+i.checked:i.type==='range'||k==='rep'?+i.value:i.value;S[k]=v;
if(k==='theme'&&v!=='Custom'){S.c=[...TH[v]];save();theme();return go('Customize')}theme();save();if(k==='vol')A.volume=v;if(k==='slide')wall();if(k==='fs'||k==='dim')i.closest('.r').firstChild.textContent=(k==='fs'?'Font size ':'Wallpaper dim ')+v});
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='k85-bios.json';a.click()};
$('#im').onchange=async e=>{try{S={...DEF,...JSON.parse(await e.target.files[0].text())};save();theme();go('Customize');toast('Imported')}catch{toast('Bad file')}}},
Wallpaper(){wgrid();$('#wf').onchange=async e=>{for(const f of e.target.files)await dbAdd({t:'w',name:f.name,blob:f});await refresh();if(!S.wall&&wl.length)S.wall=wl[0].id;save();wall();wgrid()};
$('#w0').onclick=()=>{S.wall=null;save();wall();wgrid()};
$('#wg').onclick=async e=>{const d=e.target.dataset;if(d.w){S.wall=+d.w;save();wall();wgrid()}if(d.x){await dbDel(+d.x);if(S.wall==d.x)S.wall=null;await refresh();save();wall();wgrid()}}},
Music(){list();$('#sf').onchange=async e=>{for(const f of e.target.files)await dbAdd({t:'s',name:f.name.replace(/\.[^.]+$/,''),blob:f});const id=pl[cur]?.id;await refresh();cur=pl.findIndex(x=>x.id===id);list()};
$('#pl').onclick=async e=>{const d=e.target.dataset;if(d.p!==undefined)(+d.p===cur&&!A.paused)?A.pause():(+d.p===cur?A.play():play(+d.p));if(d.d){const id=pl[cur]?.id;if(id==d.d){A.pause();A.removeAttribute('src');cur=-1}await dbDel(+d.d);await refresh();if(cur>=0)cur=pl.findIndex(x=>x.id===id);now();list()}}},
Exit(){$('#xs').onclick=()=>{save();toast('Saved')};$('#xd').onclick=()=>{S={...DEF};save();theme();wall();toast('Defaults loaded')};
$('#xe').onclick=async()=>{if(confirm('Delete all songs and wallpapers?')){A.pause();cur=-1;await dbClr();await refresh();S.wall=null;save();wall();now();toast('Erased')}};$('#xr').onclick=()=>location.reload()}};
function gh({p,r,e}){$('#ghp').innerHTML=`${row('Name',esc(p.name||p.login))}${row('Public repos',p.public_repos)}${row('Followers',p.followers)}${row('Bio',esc(p.bio||'—'))}`;
$('#ghr').innerHTML=r.map(x=>`<div class=li><a class=n href="${esc(x.html_url)}" target=_blank rel=noreferrer title="${esc(x.description||'')}">${esc(x.name)}</a><span>${esc(x.language||'')}</span><span>★${x.stargazers_count}</span></div>`).join('')||'No public repositories.';
$('#gha').innerHTML=e.map(x=>`<div class=li><span class=n>${esc(x.type.replace('Event',''))} → ${esc(x.repo.name)}</span><span>${new Date(x.created_at).toLocaleDateString('ru-RU')}</span></div>`).join('')||'No recent activity.'}
document.addEventListener('mouseover',e=>{const r=e.target.closest('[data-h]');if(r)$('#help').textContent=r.dataset.h});
document.addEventListener('focusin',e=>{const r=e.target.closest('[data-h]');if(r)$('#help').textContent=r.dataset.h});
/* games */
let graf=0,gk=null,mt;
function stopG(){cancelAnimationFrame(graf);gk=null;clearInterval(mt)}
function gameInit(){const cs=getComputedStyle(document.documentElement),col=v=>cs.getPropertyValue(v),c=$('#fc'),x=c.getContext('2d'),W=320,H=240;let b,v,p,s,run,f;
const rs=()=>{b=H/2;v=0;p=[];s=0;run=1;f=0;$('#fs').textContent=0},fl=()=>{run?v=-6:rs()};rs();
c.onpointerdown=fl;$('#fr').onclick=rs;gk=e=>{if(e.code==='Space'){e.preventDefault();fl()}};
const loop=()=>{if(run){f++;v+=.36;b+=v;if(f%80==0)p.push({x:W,t:30+Math.random()*(H-180),s:0});p.forEach(o=>o.x-=2.3);p=p.filter(o=>o.x>-50);
p.forEach(o=>{if(!o.s&&o.x+40<50){o.s=1;$('#fs').textContent=++s}if(60>o.x&&40<o.x+40&&(b-10<o.t||b+10>o.t+110))run=0});if(b>H||b<0)run=0}
x.fillStyle=col('--bg');x.fillRect(0,0,W,H);x.fillStyle=col('--ac');p.forEach(o=>{x.fillRect(o.x,0,40,o.t);x.fillRect(o.x,o.t+110,40,H)});x.fillStyle=col('--fg');x.fillRect(40,b-10,20,20);
if(!run){x.font='16px monospace';x.fillText('GAME OVER — click / Space',60,H/2)}graf=requestAnimationFrame(loop)};loop();
let st='i',to,t0,best=null;const rb=$('#rb');rb.onclick=()=>{if(st==='i'){st='w';rb.textContent='Wait...';to=setTimeout(()=>{st='g';t0=performance.now();rb.textContent='NOW!';rb.style.background='#0a0'},800+Math.random()*2200)}
